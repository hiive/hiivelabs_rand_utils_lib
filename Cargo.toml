[package]
name = "hiivelabs_rand_utils_lib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
blake2 = { version = "0.11.0-pre.4" }
# env_logger = "0.11.3"
log = "0.4.25"
log4rs = { version = "1.3.0", features = ["console_appender", "threshold_filter", "thread-id", "pattern_encoder"] }
itertools = "0.14.0"
rand = { version = "0.9.0" }
getrandom = { version = "0.3.1", features = ["wasm_js"] }


enum-map = "3.0.0-beta.2"
lazy_static = "1.5.0"
schemars = "1.0.0-alpha.17"
# natural-tts = { version = "0.1.5", features = ["non_py_tts"] }


